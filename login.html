<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — P3LBA</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="p3lba-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-ivory font-sans text-body text-ink">

<!-- SIMULASI: tidak ada autentikasi sungguhan. Akun demo di bawah hanya untuk prototipe UI. -->
<div class="grid min-h-screen lg:grid-cols-2">

  <!-- Panel kiri: visual -->
  <aside class="relative hidden overflow-hidden bg-forest-700 lg:block">
    <img src="assets/img/honai-awan.png" alt="" class="absolute inset-0 h-full w-full object-cover opacity-30">
    <div class="absolute inset-0 bg-gradient-to-t from-forest-900/90 via-forest-800/40 to-forest-700/30"></div>
    <div class="relative flex h-full flex-col justify-between p-12 text-white">
      <a href="index.html" class="flex items-center gap-3">
        <span class="grid h-12 w-12 place-items-center rounded-full bg-white p-0.5"><img src="p3lba-logo.png" alt="" class="h-full w-full rounded-full object-contain"></span>
        <span class="font-display text-xl font-bold tracking-wide">P3LBA</span>
      </a>
      <div>
        <p class="text-eyebrow uppercase text-forest-200">Panel Pengelola</p>
        <h1 class="mt-3 max-w-md font-display text-h1">Kelola Cahaya Aksara dari Satu Tempat</h1>
        <p class="mt-4 max-w-md text-white/75">Perbarui berita, galeri kegiatan, data peserta didik, dan relawan pengajar P3LBA.</p>
      </div>
    </div>
  </aside>

  <!-- Panel kanan: form -->
  <main class="flex items-center justify-center px-4 py-12 sm:px-8"
        x-data="{
          email: '', password: '', show: false, remember: true, loading: false, error: '',
          accounts: {
            'admin@p3lba.or.id':    { pass: 'admin123',    role: 'admin',    name: 'Maria Wenda' },
            'operator@p3lba.or.id': { pass: 'operator123', role: 'operator', name: 'Yosina Kogoya' }
          },
          fill(type) { this.email = type + '@p3lba.or.id'; this.password = type + '123'; this.error = ''; },
          submit() {
            this.error = ''; this.loading = true;
            setTimeout(() => {
              const acc = this.accounts[this.email.trim().toLowerCase()];
              if (!acc || acc.pass !== this.password) { this.loading = false; this.error = 'Email atau kata sandi salah.'; return; }
              try { sessionStorage.setItem('p3lba_user', JSON.stringify({ email: this.email.trim().toLowerCase(), role: acc.role, name: acc.name })); } catch (e) {}
              window.location.href = 'admin.html' + '#' + acc.role;
            }, 700);
          }
        }">
    <div class="w-full max-w-md">
      <a href="index.html" class="mb-10 flex items-center gap-3 lg:hidden">
        <span class="grid h-12 w-12 place-items-center rounded-full bg-white p-0.5 ring-1 ring-ink/10"><img src="p3lba-logo.png" alt="" class="h-full w-full rounded-full object-contain"></span>
        <span class="font-display text-xl font-bold tracking-wide text-forest-700">P3LBA</span>
      </a>

      <h2 class="font-display text-h2">Masuk</h2>
      <p class="mt-2 text-ink/65">Silakan masuk sebagai admin atau operator.</p>

      <form @submit.prevent="submit" class="mt-8 grid gap-5">
        <div x-cloak x-show="error" x-transition class="flex items-center gap-3 rounded-lg bg-terra-50 px-4 py-3 text-small text-terra-700 ring-1 ring-terra-200">
          <i class="fa-solid fa-circle-exclamation"></i><span x-text="error"></span>
        </div>

        <label class="block"><span class="text-small font-medium">Email</span>
          <div class="relative mt-1">
            <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-ink/40"></i>
            <input x-model="email" required type="email" autocomplete="username" placeholder="nama@p3lba.or.id"
                   class="w-full rounded-lg border border-ink/15 bg-white py-3 pl-11 pr-4 outline-none focus:border-forest-400 focus:ring-2 focus:ring-forest-100">
          </div>
        </label>

        <label class="block"><span class="flex items-center justify-between text-small font-medium">Kata sandi
            <a href="#" @click.prevent="error = 'Simulasi: hubungi admin untuk mengatur ulang kata sandi.'" class="font-normal text-forest-600 hover:underline">Lupa?</a></span>
          <div class="relative mt-1">
            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-ink/40"></i>
            <input x-model="password" required :type="show ? 'text' : 'password'" autocomplete="current-password" placeholder="••••••••"
                   class="w-full rounded-lg border border-ink/15 bg-white py-3 pl-11 pr-12 outline-none focus:border-forest-400 focus:ring-2 focus:ring-forest-100">
            <button type="button" @click="show = !show" class="absolute right-3 top-1/2 grid h-8 w-8 -translate-y-1/2 place-items-center text-ink/50 hover:text-ink" :aria-label="show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'">
              <i class="fa-regular" :class="show ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
        </label>

        <label class="flex items-center gap-2 text-small text-ink/70">
          <input x-model="remember" type="checkbox" class="h-4 w-4 rounded accent-forest-600"> Ingat saya
        </label>

        <button :disabled="loading" class="inline-flex items-center justify-center gap-2 rounded-md bg-forest-600 px-5 py-3 font-semibold text-white transition hover:bg-forest-700 disabled:opacity-70">
          <i x-show="loading" class="fa-solid fa-circle-notch fa-spin"></i>
          <span x-text="loading ? 'Memeriksa…' : 'Masuk'"></span>
        </button>
      </form>

      <!-- Akun demo -->
      <div class="mt-8 rounded-xl2 border border-dashed border-ochre/60 bg-peach/40 p-5">
        <p class="text-eyebrow uppercase text-bark">Akun Demo (Simulasi)</p>
        <div class="mt-3 grid gap-2 sm:grid-cols-2">
          <button type="button" @click="fill('admin')" class="rounded-lg bg-white px-4 py-3 text-left text-small ring-1 ring-ink/10 transition hover:ring-forest-400">
            <span class="flex items-center gap-2 font-semibold"><i class="fa-solid fa-user-shield text-forest-600"></i> Admin</span>
            <span class="mt-1 block text-xs text-ink/60">admin@p3lba.or.id<br>admin123</span>
          </button>
          <button type="button" @click="fill('operator')" class="rounded-lg bg-white px-4 py-3 text-left text-small ring-1 ring-ink/10 transition hover:ring-terra-400">
            <span class="flex items-center gap-2 font-semibold"><i class="fa-solid fa-user-pen text-terra-500"></i> Operator</span>
            <span class="mt-1 block text-xs text-ink/60">operator@p3lba.or.id<br>operator123</span>
          </button>
        </div>
      </div>

      <a href="index.html" class="mt-8 inline-flex items-center gap-2 text-small text-ink/60 hover:text-ink"><i class="fa-solid fa-arrow-left text-xs"></i> Kembali ke beranda</a>
    </div>
  </main>
</div>

</body>
</html>
